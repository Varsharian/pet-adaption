<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — PawFind Pet Adoption</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .hero {
    background: linear-gradient(135deg, rgba(96, 165, 250, 0.3) 0%, rgba(167, 139, 250, 0.3) 100%),
                linear-gradient(135deg, #3b82f6 0%, #F8F9FA 100%);
    min-height: 100vh;
    padding: 2rem 0;
  }

  body.dark-mode .hero {
    background: linear-gradient(135deg, rgba(49, 46, 129, 0.5) 0%, rgba(30, 58, 138, 0.5) 100%),
                linear-gradient(135deg, #1e3a8a 0%, #F8F9FA 100%);
  }

  .login-card {
    background: #fff;
    border-radius: 1.2rem;
    padding: 2.5rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    max-width: 450px;
    margin: 0 auto;
  }

  body.dark-mode .login-card {
    background: #1f2937;
    color: #f9fafb;
  }

  body.dark-mode .form-control {
    background: #374151;
    border-color: #4b5563;
    color: #f9fafb;
  }

  body.dark-mode .form-control:focus {
    background: #374151;
    border-color: #8b5cf6;
    color: #f9fafb;
  }

  body.dark-mode .form-check-label {
    color: #d1d5db;
  }

  .login-title {
    color: #7c3aed;
    font-weight: 700;
    margin-bottom: 0.5rem;
  }

  body.dark-mode .login-title {
    color: #a78bfa;
  }

  .login-subtitle {
    color: #6b7280;
    margin-bottom: 1.5rem;
  }

  body.dark-mode .login-subtitle {
    color: #9ca3af;
  }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="login.html">PawFind</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <div class="ms-auto">
        <button id="themeToggle" class="btn btn-outline-light btn-sm" type="button">Dark Mode</button>
      </div>
    </div>
  </div>
</nav>

<header class="hero d-flex align-items-center text-white">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="login-card">
          <h2 class="login-title text-center">Welcome Back</h2>
          <p class="login-subtitle text-center">Sign in to your PawFind account</p>

          <form id="loginForm" onsubmit="return validateLogin()">
            <div class="mb-3">
              <label for="loginEmail" class="form-label">Email Address</label>
              <input 
                type="email" 
                class="form-control" 
                id="loginEmail" 
                placeholder="you@example.com"
                required>
            </div>

            <div class="mb-3">
              <label for="loginPassword" class="form-label">Password</label>
              <input 
                type="password" 
                class="form-control" 
                id="loginPassword" 
                placeholder="Enter your password"
                required>
            </div>

            <div class="mb-3 form-check">
              <input 
                type="checkbox" 
                class="form-check-input" 
                id="rememberMe">
              <label class="form-check-label" for="rememberMe">
                Remember me
              </label>
            </div>

            <button type="submit" class="btn btn-warning w-100 mb-3 text-white fw-semibold">
              Login
            </button>

            <div class="text-center mb-3">
              <span class="text-muted">or</span>
            </div>

            <button type="button" onclick="googleSignIn()" class="btn btn-outline-secondary w-100 mb-3 d-flex align-items-center justify-content-center gap-2">
              <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                <path fill="none" d="M0 0h48v48H0z"/>
              </svg>
              Sign in with Google
            </button>

            <div class="text-center">
              <small class="text-muted">
                Don't have an account? 
                <a href="signup.html" class="text-decoration-none fw-semibold" style="color: #7c3aed;">Sign up</a>
              </small>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</header>

<footer class="footer bg-dark text-white py-4">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
    <p class="mb-0">PawFind © 2026 · Pet Adoption Paradise</p>
    <div>
      <a href="#" class="text-white text-decoration-none me-3">Privacy</a>
      <a href="#" class="text-white text-decoration-none">Support</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js?v=3"></script>

</body>
</html>
